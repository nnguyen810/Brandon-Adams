<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Brandon Adam's Security Services, Inc.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body>
    <header class="top-nav" aria-label="Primary navigation">
      <nav class="nav-links">
        <a class="nav-btn" href="./index.html">Home</a>
        <a class="nav-btn" href="./about.html">About</a>
        <a class="nav-btn" href="./services.html">Services</a>
        <a class="nav-btn active" href="./contact.html">Contact</a>
      </nav>
    </header>
    <main class="page-wrap">
      <section class="page-card" aria-label="Contact content">
        <h1>Contact Us</h1>
        <p>
          Reach out to discuss your security needs. We are ready to help you
          build a stronger protection plan.
        </p>

        <form id="contact-form" class="contact-form" novalidate>
          <label for="contact-name">Name</label>
          <input id="contact-name" name="name" type="text" required />

          <label for="contact-email">Email</label>
          <input id="contact-email" name="email" type="email" required />

          <label for="contact-message">Description</label>
          <textarea
            id="contact-message"
            name="message"
            rows="4"
            maxlength="2000"
            placeholder="Tell us what you want to contact us about."
            required
          ></textarea>

          <button class="send-btn" type="submit">Send</button>
          <p
            id="form-status"
            class="form-status"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="./static/site-config.js"></script>
    <script src="./static/contact-form.js"></script>
  </body>
</html>
